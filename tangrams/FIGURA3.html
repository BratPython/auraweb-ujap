<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangram Recreación Exacta - Flecha Corregida</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            width: 90vmin;
            height: 90vmin;
            max-width: 800px;
            max-height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.7));
        }

        /* Efecto sutil de interacción idéntico al original */
        polygon {
            cursor: pointer;
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        polygon:hover {
            filter: brightness(1.15);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
            
            <polygon points="50,680 384,680 167,463" 
                     fill="#CD0E66" stroke="#CD0E66" stroke-width="1.2" stroke-linejoin="round"/>
            
            <polygon points="314,250 314,610 134,430" 
                     fill="#0F82F2" stroke="#0F82F2" stroke-width="1.2" stroke-linejoin="round"/>
            
            <polygon points="171,250 314,250 171,393" 
                     fill="#009EA6" stroke="#009EA6" stroke-width="1.2" stroke-linejoin="round"/>
            
            <polygon points="314,369 457,369 457,512 314,512" 
                     fill="#22AB24" stroke="#22AB24" stroke-width="1.2" stroke-linejoin="round"/>
            
            <polygon points="457,512 457,369 600,512" 
                     fill="#EB4726" stroke="#EB4726" stroke-width="1.2" stroke-linejoin="round"/>
            
            <polygon points="457,369 600,369 743,512 600,512" 
                     fill="#FD8C00" stroke="#FD8C00" stroke-width="1.2" stroke-linejoin="round"/>
            
            <polygon points="600,369 800,369 800,569" 
                     fill="#6D3BBF" stroke="#6D3BBF" stroke-width="1.2" stroke-linejoin="round"/>
                     
        </svg>
    </div>

</body>
</html>
