<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tangram Recreación Exacta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            width: 90vmin;
            height: 90vmin;
            max-width: 800px;
            max-height: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.7));
        }

        polygon {
            cursor: pointer;
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        polygon:hover {
            filter: brightness(1.15);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
            
            <polygon points="100,0 300,0 300,200" 
                     fill="#0084FF" stroke="#0084FF" stroke-width="0.5" stroke-linejoin="round"/>
            
            <polygon points="0,0 100,0 200,100 100,100" 
                     fill="#FF9500" stroke="#FF9500" stroke-width="0.5" stroke-linejoin="round"/>
            
            <polygon points="0,0 100,100 0,100" 
                     fill="#00A3A6" stroke="#00A3A6" stroke-width="0.5" stroke-linejoin="round"/>
            
            <polygon points="200,100 300,200 100,200" 
                     fill="#6D3BBF" stroke="#6D3BBF" stroke-width="0.5" stroke-linejoin="round"/>
            
            <polygon points="0,100 200,300 0,300" 
                     fill="#D10069" stroke="#D10069" stroke-width="0.5" stroke-linejoin="round"/>
            
            <polygon points="100,200 200,200 200,300" 
                     fill="#EB4726" stroke="#EB4726" stroke-width="0.5" stroke-linejoin="round"/>
            
            <polygon points="200,200 300,200 300,300 200,300" 
                     fill="#22AB24" stroke="#22AB24" stroke-width="0.5" stroke-linejoin="round"/>
                     
        </svg>
    </div>

</body>
</html>
